# Fly.io 배포 — 도메인/인증서 설정 없이 HTTPS가 바로 붙는 가장 빠른 경로.
#
#   fly launch --no-deploy --copy-config --name <앱이름>
#   fly volumes create sync_data --size 1 --region nrt
#   fly secrets set SYNC_TOKEN=$(node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))")
#   fly deploy
#
# 배포 후 주소: https://<앱이름>.fly.dev
app = "todo-checker-sync"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "sync_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "3s"
  path = "/health"
