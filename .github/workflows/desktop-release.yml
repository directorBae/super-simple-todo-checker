# macOS 설치본 — 릴리스(v* 태그)가 만들어지면 GitHub의 맥에서 빌드해 그 릴리스에 붙인다. 맥이 따로 없어도 된다.
# Windows 설치본은 지금처럼 PC에서 만들어 `gh release create`로 올리고, 이 작업이 맥 파일(dmg·zip·latest-mac.yml)을 더한다.
# 앱의 electron-updater가 latest-mac.yml을 보고 자동 업데이트한다 (맥 자동 업데이트는 서명된 앱에서만 동작).
#
# 서명·공증은 아래 Secrets가 있을 때만 한다 (없으면 미서명 빌드 — 처음 열 때 "확인되지 않은 개발자" 경고).
#   CSC_LINK, CSC_KEY_PASSWORD               — Developer ID Application 인증서(.p12, base64)와 비밀번호
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER — 공증용 App Store Connect API 키(.p8 내용), 키 ID, Issuer ID
# 손으로 돌리면(workflow_dispatch) 릴리스에는 손대지 않고 빌드 결과만 Artifacts로 남긴다.
name: desktop-release-mac

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write        # 릴리스에 파일을 붙이려면 필요
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존성 설치
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # 서명 인증서 점검: 값은 찍지 않고, 풀리는지·열리는지·맥 키체인이 받아들이는지만 알린다.
      - name: 서명 인증서 점검
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then echo "인증서 없음 → 미서명 빌드"; exit 0; fi
          echo "CSC_LINK 길이 ${#CSC_LINK}, 비밀번호 길이 ${#CSC_KEY_PASSWORD}"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/check.p12" && echo "base64 풀기: 성공 ($(wc -c < "$RUNNER_TEMP/check.p12") bytes)"
          openssl pkcs12 -in "$RUNNER_TEMP/check.p12" -passin env:CSC_KEY_PASSWORD -noout && echo "비밀번호로 열기: 성공" || echo "비밀번호로 열기: 실패"
          security create-keychain -p check "$RUNNER_TEMP/check.keychain" >/dev/null
          security import "$RUNNER_TEMP/check.p12" -k "$RUNNER_TEMP/check.keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null && echo "맥 키체인 가져오기: 성공" || echo "맥 키체인 가져오기: 실패"
          rm -f "$RUNNER_TEMP/check.p12"; security delete-keychain "$RUNNER_TEMP/check.keychain" || true

      - name: 빌드 (Apple 칩 · 인텔)
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node scripts/write-supabase-config.cjs
          npx vite build
          extra=""
          if [ -z "$CSC_LINK" ]; then
            echo "서명 인증서가 없어 미서명으로 빌드합니다."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            extra="-c.mac.notarize=false -c.mac.identity=null"
          elif [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          else
            extra="-c.mac.notarize=false"
          fi
          npx electron-builder --mac --arm64 --x64 --publish never $extra

      - name: 릴리스에 붙이기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/release/*.dmg desktop/release/*.zip desktop/release/*.blockmap desktop/release/latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"

      - name: 빌드 결과 보관 (손으로 돌린 경우)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: checker-mac
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
