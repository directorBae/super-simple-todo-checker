<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체커 연결</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; font-family: Pretendard, -apple-system, "Segoe UI", sans-serif; color: #141a2e;
    background: radial-gradient(1000px 600px at 15% 10%, #a8d8ff, transparent 60%), radial-gradient(800px 600px at 90% 85%, #7d8cff, transparent 60%), #dfe8f8; }
  main { width: min(420px, 100%); text-align: center; padding: 34px 26px 26px; border-radius: 26px; background: linear-gradient(160deg, rgba(255,255,255,.7), rgba(255,255,255,.42));
    border: 1px solid rgba(255,255,255,.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 1px 1px #fff, 0 24px 70px rgba(8,14,40,.18); }
  .mark { width: 60px; height: 60px; margin: 0 auto 6px; display: grid; place-items: center; font-size: 30px; border-radius: 19px; background: rgba(255,255,255,.75); color: #5b5bd6; }
  .mark.bad { color: #c0392b; }
  h1 { font-size: 22px; margin: 12px 0 8px; } p { color: #4f5670; line-height: 1.6; margin: 0 0 20px; }
  a { display: inline-block; padding: 11px 22px; border-radius: 14px; background: linear-gradient(135deg, #7a6cff, #5b5bd6); color: #fff; text-decoration: none; font-weight: 600; }
  small { display: block; margin-top: 14px; color: #6a7088; }
</style>
</head>
<body>
<main>
  <div class="mark" id="mark">✓</div>
  <h1 id="title">연결했어요</h1>
  <p id="text">앱으로 돌아가세요.</p>
  <a href="todochecker://settings/tools">앱으로 돌아가기</a>
  <small>이 창은 닫아도 돼요. PC 앱과 웹은 몇 초 안에 알아서 바뀌어요.</small>
</main>
<script>
  // The connection result comes in the address (from the checker connection server); shown as text, never as HTML.
  const q = new URLSearchParams(location.search);
  if (q.get('title')) document.getElementById('title').textContent = q.get('title');
  if (q.get('text')) document.getElementById('text').textContent = q.get('text');
  if (q.get('ok') === '0') { const m = document.getElementById('mark'); m.textContent = '!'; m.className = 'mark bad'; }
  document.title = document.getElementById('title').textContent + ' — 체커';
</script>
</body>
</html>
