<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>할 일 체커</title>
  </head>
  <body>
    <!-- 유리 굴절(왜곡) 필터 — backdrop-filter: url(#...)로 사용 (Chromium 전용) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="glass-dist" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="92" result="n" />
        <feGaussianBlur in="n" stdDeviation="3" result="nb" />
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="26" xChannelSelector="R" yChannelSelector="G" result="d" />
        <feGaussianBlur in="d" stdDeviation="16" result="db" />
        <feColorMatrix in="db" type="saturate" values="1.65" />
      </filter>
      <filter id="glass-dist-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="7" result="n" />
        <feGaussianBlur in="n" stdDeviation="2" result="nb" />
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="12" xChannelSelector="R" yChannelSelector="G" result="d" />
        <feGaussianBlur in="d" stdDeviation="10" result="db" />
        <feColorMatrix in="db" type="saturate" values="1.5" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
